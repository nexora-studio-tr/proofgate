name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts --no-fund
      - run: node --input-type=module -e "import fs from 'node:fs'; if (process.env.GITHUB_REF_NAME !== 'v'+JSON.parse(fs.readFileSync('package.json')).version) process.exit(1)"
      - run: npm run release:pack
      - run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            echo "Release already exists; preserving its uploaded assets and notes."
          else
            gh release create "$GITHUB_REF_NAME" artifacts/release/*.tgz artifacts/release/*.sha256 --verify-tag --prerelease --title "ProofGate $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
