name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts --no-fund
      - run: node --input-type=module -e "import fs from 'node:fs'; if (process.env.GITHUB_REF_NAME !== 'v'+JSON.parse(fs.readFileSync('package.json')).version) process.exit(1)"
      - run: npm run release:pack
      - run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            asset_count=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')
            if [ "$asset_count" = "0" ]; then
              gh release upload "$GITHUB_REF_NAME" artifacts/release/*.tgz artifacts/release/*.sha256
            else
              expected="proofgate-${GITHUB_REF_NAME#v}.tgz"
              asset_names=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
              printf '%s\n' "$asset_names" | grep -Fx "$expected"
              printf '%s\n' "$asset_names" | grep -Fx "$expected.sha256"
              echo "Existing complete assets and notes are preserved."
            fi
          else
            gh release create "$GITHUB_REF_NAME" artifacts/release/*.tgz artifacts/release/*.sha256 --verify-tag --prerelease --title "ProofGate $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
